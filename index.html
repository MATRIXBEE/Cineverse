<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineverse: Movie Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Montserrat', sans-serif;
      }
      .spotlight-card {
        position: relative;
        overflow: hidden;
      }
      .spotlight-card:before {
        content: '';
        position: absolute;
        left: var(--x, 50%);
        top: var(--y, 50%);
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        background-image: radial-gradient(circle, rgba(0, 255, 255, 0.15) 0%, rgba(0, 255, 255, 0) 60%);
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
        pointer-events: none;
      }
      .spotlight-card:hover:before {
        opacity: 1;
      }
      .gradient-text {
        background: linear-gradient(90deg, #fff, #aaa, #fff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shine 8s linear infinite;
      }
      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }
      .shimmer-poster {
        position: relative;
        overflow: hidden;
      }
      @keyframes move-blob-1 {
        0% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(30vw, -20vh) scale(1.2); }
        50% { transform: translate(-20vw, 20vh) scale(0.8); }
        75% { transform: translate(20vw, 30vh) scale(1.1); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes move-blob-2 {
        0% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(-20vw, 30vh) scale(0.8); }
        50% { transform: translate(30vw, -30vh) scale(1.3); }
        75% { transform: translate(-30vw, -20vh) scale(0.9); }
        100% { transform: translate(0, 0) scale(1); }
      }
      .animated-blob-1 {
        position: fixed;
        top: 20vh;
        left: 20vw;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, rgba(0, 255, 255, 0) 70%);
        border-radius: 50%;
        filter: blur(80px);
        animation: move-blob-1 30s infinite alternate ease-in-out;
        z-index: 0;
      }
      .animated-blob-2 {
        position: fixed;
        bottom: 20vh;
        right: 20vw;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(255, 0, 255, 0.15) 0%, rgba(255, 0, 255, 0) 70%);
        border-radius: 50%;
        filter: blur(100px);
        animation: move-blob-2 35s infinite alternate ease-in-out;
        z-index: 0;
      }

      /* GLOW BORDER for Movie Detail page */
      .glow-border {
        position: relative;
        background-clip: padding-box;
      }
      .glow-border::before {
        content: '';
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        z-index: -1;
        margin: -2px; /* Control glow size */
        border-radius: inherit;
        background: linear-gradient(145deg, rgba(0, 255, 255, 0.4), rgba(255, 0, 255, 0.3));
        filter: blur(8px);
        opacity: 0.8;
        transition: opacity 0.3s;
      }
      .glow-border:hover::before {
        opacity: 1;
      }

      /* SHINE BUTTON for Book buttons */
      .shine-button {
        position: relative;
        overflow: hidden;
      }
      .shine-button::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -150%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          to right, 
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.3) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: rotate(25deg);
        pointer-events: none;
        transition: left 0.6s ease;
      }
      .shine-button:hover::after {
        left: 150%;
      }

      /* SCREEN VISUAL for Booking page */
      .screen-visual {
        position: relative;
        overflow: hidden;
      }
      .screen-visual::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        animation: light-sweep 4s infinite ease-in-out;
        animation-delay: 1s;
      }
      @keyframes light-sweep {
        0% { left: -100%; }
        100% { left: 150%; }
      }

      /* QR SCANNER for Payment Modal */
      .qr-scanner::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.9), transparent);
        animation: scan-line 2.5s infinite ease-in-out;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
        border-radius: 3px;
      }

      @keyframes scan-line {
        0% { top: 0; }
        50% { top: calc(100% - 3px); }
        100% { top: 0; }
      }

      /* CONFETTI for Payment Success */
      @keyframes confetti-fall {
        0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.548.0",
    "qrcode.react": "https://aistudiocdn.com/qrcode.react@^4.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
  }
}
</script>

</head>
